name: Fuentes oficiales de alertas (SMN y COE)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Direcciones de páginas a descargar, separadas por espacios'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: escritura-datos
  cancel-in-progress: false
jobs:
  fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Descargar y publicar
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          pip install -q pypdf || echo "pypdf no disponible: los PDF quedan sin texto"
          git config user.name "Tablero Ciudadano"
          git config user.email "tablerocorrientes@gmail.com"
          for i in 1 2 3; do
            git fetch -q --depth 1 origin main && git reset -q --hard origin/main
            python3 tareas/fuentes_oficiales.py || exit 1
            git add data/fuentes
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -qm "Fuentes oficiales (automático): SMN y COE, $(TZ=America/Argentina/Buenos_Aires date '+%d/%m/%Y %H:%M') h"
            git push origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
