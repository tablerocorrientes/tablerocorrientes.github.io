name: Pronóstico extendido (cada 2 horas)
on:
  schedule:
    - cron: '40 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: escritura-datos
  cancel-in-progress: false
jobs:
  extendido:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Calcular y publicar
        run: |
          pip install -q pillow || echo "Pillow no disponible: satélite sin cambios"
          git config user.name "Tablero Ciudadano"
          git config user.email "tablerocorrientes@gmail.com"
          for i in 1 2 3; do
            git fetch -q --depth 1 origin main && git reset -q --hard origin/main
            python3 tareas/extendido_ciudades.py || exit 0
            python3 tareas/satelite.py
            python3 tareas/esperado_dia.py || true
            git add data/esperado_dia.json data/bitacora data/pron.json data/sat.json assets/sat.jpg
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -qm "Pronóstico extendido (automático): ciudades de referencia, $(TZ=America/Argentina/Buenos_Aires date '+%d/%m/%Y %H:%M') h"
            git push origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
