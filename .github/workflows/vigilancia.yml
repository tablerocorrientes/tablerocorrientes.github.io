name: Vigilancia durante alertas (lluvia, satélite, SMN y COE cada 15 minutos)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: vigilancia
  cancel-in-progress: false
jobs:
  vigilancia:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Ciclo de vigilancia
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -q pillow pypdf || true
          git config user.name "Tablero Ciudadano"
          git config user.email "tablerocorrientes@gmail.com"
          INICIO=$(date +%s); N=0
          while true; do
            git fetch -q --depth 1 origin main && git reset -q --hard origin/main
            if ! python3 tareas/vigilancia_condicion.py; then echo "Fin de la vigilancia: sin alerta ni lluvia"; exit 0; fi
            N=$((N+1))
            for i in 1 2 3; do
              git fetch -q --depth 1 origin main && git reset -q --hard origin/main
              python3 tareas/esperado_dia.py || true
              python3 tareas/snih_lluvia.py || true
              python3 tareas/satelite.py || true
              if [ $((N % 2)) -eq 1 ]; then python3 tareas/fuentes_oficiales.py || true; fi
              if [ $((N % 4)) -eq 1 ]; then python3 tareas/extendido_ciudades.py || true; fi
              git add data/esperado_dia.json data/lluvia.json data/obs.json data/sat.json assets/sat.jpg data/fuentes data/pron.json
              if git diff --cached --quiet; then echo "Ciclo $N: sin cambios"; break; fi
              git commit -qm "Vigilancia (automática): lluvia, satélite y fuentes oficiales, $(TZ=America/Argentina/Buenos_Aires date '+%d/%m/%Y %H:%M') h"
              git push -q origin HEAD:main && { echo "Ciclo $N publicado"; break; }
              sleep 20
            done
            if [ $(( $(date +%s) - INICIO )) -gt 19800 ]; then
              echo "Casi 6 horas: se relanza la vigilancia"
              gh workflow run vigilancia.yml --ref main || true
              exit 0
            fi
            sleep 900
          done
