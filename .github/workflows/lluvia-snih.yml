name: Lluvia SNIH (cada 30 minutos)
on:
  schedule:
    - cron: '20 * * * *'
    - cron: '50 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: lluvia-snih
  cancel-in-progress: false
jobs:
  lluvia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Consultar el SNIH y actualizar lluvia.json y obs.json
        run: |
          python3 tareas/snih_lluvia.py || true
          python3 tareas/esperado_dia.py || true
          python3 tareas/registro.py || true
      - name: Publicar si hubo cambios
        run: |
          git config user.name "Tablero Ciudadano"
          git config user.email "tablerocorrientes@gmail.com"
          git add data/esperado_dia.json data/bitacora data/registro data/lluvia.json data/obs.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Lluvia SNIH (automática): actualiza lluvia.json y obs.json, $(TZ=America/Argentina/Buenos_Aires date '+%d/%m/%Y %H:%M') h"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
      - name: Encender la vigilancia si hay alerta o lluvia (reemplaza al disparador horario)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch -q --depth 1 origin main && git reset -q --hard origin/main || true
          if python3 tareas/vigilancia_condicion.py; then
            ACT=$(gh run list --workflow vigilancia.yml --json status --jq '[.[]|select(.status=="in_progress" or .status=="queued")]|length' 2>/dev/null || echo 0)
            if [ "$ACT" = "0" ]; then gh workflow run vigilancia.yml --ref main && echo "Vigilancia encendida"; else echo "Vigilancia ya en curso"; fi
          else echo "Sin alerta ni lluvia: vigilancia no necesaria"; fi
